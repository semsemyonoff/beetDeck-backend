name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The only step that fetches from github.com, over a link that drops often
      # enough to matter. A download that dies part-way is not just a failed run:
      # the half-written interpreter stays in the shared tool cache *marked
      # complete*, so every later job reuses it and fails in 20 seconds on
      # `import email` from the stdlib. Hence retry-after-clearing rather than a
      # plain retry — the second attempt must not find the wreckage of the first.
      - uses: actions/setup-python@v7
        id: python
        continue-on-error: true
        with:
          python-version: "3.14"
      - name: Clear the half-installed interpreter
        if: steps.python.outcome == 'failure'
        run: rm -rf "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/Python/3.14."*
      - uses: actions/setup-python@v7
        if: steps.python.outcome == 'failure'
        with:
          python-version: "3.14"
      # Lint/format only need ruff, not the full app deps (which pull the beets
      # source tarball) — keep this job fast.
      - run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .

  test:
    # Sequential, not for the dependency — the suites are independent — but for
    # the tool cache. Both jobs ask for the same `python-version` and share one
    # `hostedtoolcache` volume on the self-hosted runner, so on a version neither
    # has cached they would install it twice at once, each deleting the version
    # folder the other is copying into. This way one job installs and the other
    # reads, and only one of them can be caught by a dropped download.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Normally a cache hit — `lint` ran first and installed it. The retry is
      # here anyway for the run where the cache was swept in between; see the
      # comment on the same step above.
      - uses: actions/setup-python@v7
        id: python
        continue-on-error: true
        with:
          python-version: "3.14"
      - name: Clear the half-installed interpreter
        if: steps.python.outcome == 'failure'
        run: rm -rf "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/Python/3.14."*
      - uses: actions/setup-python@v7
        if: steps.python.outcome == 'failure'
        with:
          python-version: "3.14"
      # Most of the suite mocks subprocesses, but the format-replace integration
      # tests (tests/test_scan_replace.py) run a real `beet import` and generate
      # audio with ffmpeg, so ffmpeg must be on PATH for them to run rather than
      # skip (see the shutil.which guard in that module).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
