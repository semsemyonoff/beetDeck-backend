name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Lint/format only need ruff, not the full app deps (which pull the beets
      # source tarball) — keep this job fast.
      - run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Most of the suite mocks subprocesses, but the format-replace integration
      # tests (tests/test_scan_replace.py) run a real `beet import` and generate
      # audio with ffmpeg, so ffmpeg must be on PATH for them to run rather than
      # skip (see the shutil.which guard in that module).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
