[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beetdeck"
version = "0.0.0"
description = "Web UI for browsing and managing a beets music library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "gunicorn",
    "pyacoustid",
    "requests",
    "pylast",
    "beautifulsoup4",
    "Pillow",
    "spectree",
    # beets is pinned to an exact release tarball; bump the tag here to change
    # the version — single source of truth. The URL form is deliberate even
    # though beets is published on PyPI: the shared Renovate preset
    # (beetDeck/renovate-config) tracks beets via a customManager regex on this
    # exact tarball URL, so changing the pin's shape would silence it.
    "beets @ https://github.com/beetbox/beets/archive/refs/tags/v2.13.1.tar.gz",
    "librosa",
    "resampy",
    # MCP server (beetdeck_mcp): runs as a separate process from this same
    # install, so its deps belong here rather than in an extra — the image's
    # sync-venv.sh installs exactly `-e ".[dev]"` and nothing else.
    "mcp",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]

# The app is run from source (gunicorn app:app), not imported as a library, but
# it is still pip-installable so `pip install .` / `pip install -e ".[dev]"`
# resolves dependencies straight from this file.
[tool.setuptools]
py-modules = ["app"]

# The glob is deliberate, not incidental: it already matches `beetdeck_mcp`
# alongside `beetdeck`, so the MCP package needs no packaging change.
[tool.setuptools.packages.find]
include = ["beetdeck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["beetdeck", "beetdeck_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length is handled by the formatter
